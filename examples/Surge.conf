# CotEditor Surge syntax example. Documentation addresses are not live proxies.
[General]
loglevel = notify
dns-server = system, 1.1.1.1
ipv6 = true # Enable IPv6

[Proxy]
Example = http, proxy.example.com, 8080, username=demo, password="quoted # text; https://example.com/path#fragment"

[Proxy Group]
Outbound = select, DIRECT, Example

[Rule]
DOMAIN-SUFFIX,example.com,Outbound
AND,((PROTOCOL,TCP),(DEST-PORT,443)),DIRECT
IP-CIDR,192.0.2.0/24,DIRECT,no-resolve
FINAL,DIRECT // Default policy

[URL Rewrite]
^https://old\.example\.com/(.*) https://new.example.com/$1 302

[MITM]
enable = false
hostname = *.example.com
